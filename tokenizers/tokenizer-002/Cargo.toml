[package]
name = "tokenizer-002"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.0", default-features = true, features = ["onig"] }
walkdir = "2.5"
ahash = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
